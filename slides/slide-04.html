<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>

@font-face { font-family:'Inter'; font-weight:400; font-style:normal;
  src: url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family:'Inter'; font-weight:500; font-style:normal;
  src: url('../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family:'Inter'; font-weight:600; font-style:normal;
  src: url('../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family:'Inter'; font-weight:700; font-style:normal;
  src: url('../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family:'Inter'; font-weight:800; font-style:normal;
  src: url('../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family:'Inter'; font-weight:900; font-style:normal;
  src: url('../node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2') format('woff2'); }

</style>
<link rel="stylesheet" href="../base.css">
</head>
<body>
<div class="bg-spatial" id="slide">

  <!-- Slide counter -->
  <div class="slide-counter">4 <span style="opacity:.4">/</span> 6</div>

  <!-- Radial glow behind stat -->
  <div style="position:absolute;width:800px;height:800px;border-radius:50%;
    background:radial-gradient(circle,rgba(37,99,235,0.18) 0%,transparent 68%);
    top:180px;left:50%;transform:translateX(-50%);pointer-events:none;"></div>

  <!-- Stat content -->
  <div style="position:absolute;top:240px;left:0;right:0;text-align:center;">
    <div id="stat-num"  class="t-stat">3×</div>
    <div id="stat-label" class="t-headline" style="margin-top:12px;">more reach with carousels</div>
    <div id="ctx" class="t-body" style="margin-top:24px;padding:0 100px;text-align:center;">Carousels get 3× more saves than single images — and saves are the metric Instagram rewards most.</div>
  </div>

  <!-- Avatar — victory, centered bottom -->
  <img id="avatar" class="avatar" src="../assets/pose-victory-cutout.png"
       style="height:600px;left:50%;transform:translateX(-50%);bottom:0;" />

  <!-- Brand tag -->
  <div class="brand-tag">@nishit</div>

</div>
<script src="../gsap.min.js"></script>
<script>

  const _qs   = new URLSearchParams(location.search);
  const _t    = _qs.get('t');
  const RMODE = _t !== null;
  const tl    = gsap.timeline({ paused: RMODE });


  tl
    .from('#stat-num',   { scale:0.4, opacity:0, duration:0.75, ease:'back.out(1.6)' }, 0)
    .from('#stat-label', { y:28,      opacity:0, duration:0.55, ease:'power2.out' }, 0.55)
    .from('#ctx',{y:20,opacity:0,duration:0.42,ease:'power2.out'}, 1.05)
    .from('#avatar',     { y:50,      opacity:0, duration:0.65, ease:'power3.out' }, 0.40);


  if (RMODE) {
    tl.seek(parseFloat(_t), false);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.title = '__FRAME_READY__';
    }));
  } else {
    tl.play();
  }

</script>
</body>
</html>
